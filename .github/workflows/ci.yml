name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # A throwaway database is enough for Milestone 0: no migration/app code
      # currently depends on it being reachable at import time, and the one
      # test that needs a live database skips itself if it isn't reachable.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nutriplan
      POSTGRES_PASSWORD: nutriplan_ci_only
      POSTGRES_DB: nutriplan
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: nutriplan_ci_only
          POSTGRES_DB: nutriplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Test (pytest)
        run: python -m pytest -v

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build
